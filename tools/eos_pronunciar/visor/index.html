     binarios (eos.glb, gafas.glb, textures/, clips/) no van en el repositorio. Si cambias el de D:,
     copia aquí; si cambias este, copia a D:. Lengua: ejes, constantes y topes del 4 oct 2026. -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eos · Pléyade</title>
<style>
  :root { --azul: #0b1840; --azul2: #16296b; --oro-rosa: #e7a98c; --oro: #f3c768; --texto: #f6ece4; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 35%, #25397f 0%, var(--azul) 55%, #050a1f 100%); color: var(--texto); font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #subt { min-height: 2.6em; max-width: 760px; text-align: center; font-size: clamp(16px, 2.4vw, 22px); line-height: 1.3; text-shadow: 0 1px 6px #000a; }
  #subt .ya { color: var(--oro); }
  #barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  button, select { font: inherit; font-size: 15px; background: #0b1840cc; color: var(--texto); border: 1px solid var(--oro-rosa); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  button:hover { background: var(--azul2); }
  #titulo { position: fixed; top: 14px; left: 0; right: 0; text-align: center; letter-spacing: .25em; color: var(--oro-rosa); font-size: 15px; }
  #estado { position: fixed; top: 38px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="titulo">PLÉYADE · EOS</div>
<div id="estado">cargando…</div>
<div id="ui">
  <div id="subt"></div>
  <div id="barra">
    <select id="clip"></select>
    <button id="hablar">▶ Hablar</button>
    <button id="lentes">Gafas</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CLIPS = await fetch('clips.json').then(r => r.json());   // [{id, titulo}]
const estado = document.getElementById('estado');
const subt = document.getElementById('subt');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
// luz de amanecer: una llave cálida alta a un lado, relleno frío y un contraluz dorado
const llave = new THREE.DirectionalLight(0xffd6a8, 2.6); llave.position.set(0.6, 1.9, 1.2); scene.add(llave);
const relleno = new THREE.DirectionalLight(0xbfd0ff, 0.7); relleno.position.set(-1.2, 1.5, 0.8); scene.add(relleno);
const contra = new THREE.DirectionalLight(0xffc36b, 2.2); contra.position.set(-0.4, 2.0, -1.2); scene.add(contra);

const camara = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.01, 50);
const controles = new OrbitControls(camara, renderer.domElement);
controles.enableDamping = true;

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
const cargador = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);
const MODELO = new URLSearchParams(location.search).get('modelo') || 'eos.glb';   // eos_web.glb: la versión comprimida

const gltf = await cargador.loadAsync(MODELO);
const eos = gltf.scene; scene.add(eos);
window.__eos = eos; window.__THREE = THREE;
const morphs = [];            // [{mesh, dict}]
let cabeza = null; const cabezas = [];
eos.traverse(o => {
  if (o.isMesh && o.morphTargetDictionary) morphs.push(o);
  if (o.isBone && /^head$/i.test(o.name)) { cabezas.push(o); cabeza = cabeza ?? o; }
  if (o.isMesh) o.frustumCulled = false;
});
// materiales que el GLB de MetaHuman trae planos (ver mh_materials.json del exportador):
// pelo y cejas son tarjetas cuya cobertura va en el canal R del atlas de atributos, y el G
// va de la raíz a la punta; con eso se pinta el degradado raíz castaña → puntas rubias.
async function atlasPelo(url, raiz, punta, reflejo) {
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const cob = p[i], t = p[i + 1] / 255, v = ((i * 2654435761) >>> 24) / 255;   // v: variación por hebra
    const mezcla = k => raiz[k] + (punta[k] - raiz[k]) * t + (reflejo[k] - raiz[k]) * 0.18 * v;
    p[i] = mezcla(0); p[i + 1] = mezcla(1); p[i + 2] = mezcla(2); p[i + 3] = cob;
  }
  g.putImageData(d, 0, 0);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false;
  return tex;
}
const TEX = 'textures/';
// tela de la blusa: café con florecitas crema y rosa palo, pintada en un lienzo que se repite
function telaFlores() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#3f2416'; g.fillRect(0, 0, 256, 256);
  const flor = (x, y, r, color) => {
    g.fillStyle = color;
    for (let k = 0; k < 5; k++) { const a = k * 2 * Math.PI / 5; g.beginPath(); g.arc(x + r * Math.cos(a), y + r * Math.sin(a), r * 0.62, 0, 2 * Math.PI); g.fill(); }
    g.fillStyle = '#e8c36a'; g.beginPath(); g.arc(x, y, r * 0.45, 0, 2 * Math.PI); g.fill();
  };
  const r = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  for (let i = 0; i < 34; i++) {
    const x = r() * 256, y = r() * 256, t = 2.2 + r() * 1.8, col = r() < 0.55 ? '#f1e2cc' : '#e7b4a8';
    for (const dx of [-256, 0, 256]) for (const dy of [-256, 0, 256]) flor(x + dx, y + dy, t, col);   // costuras sin corte
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 8); tex.anisotropy = 8;
  return tex;
}
const peloMap = await atlasPelo(TEX + 'Hair_M_Layered_CardsAtlas_Attribute.png', [92, 60, 38], [214, 170, 112], [190, 96, 52]);
const cejaMap = await atlasPelo(TEX + 'Eyebrows_M_Full_CardsAtlas_Attribute.png', [96, 64, 40], [128, 88, 56], [140, 84, 48]);   // castañas, como la raíz del pelo
const pestanaMap = await new THREE.TextureLoader().loadAsync(TEX + 'T_Eyelashes_L_ThickCurl_Coverage.png');
pestanaMap.flipY = false;
eos.traverse(o => {
  if (!o.isMesh) return;
  for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
    const n = m.name;
    if (/Hair_.*CardMat|Eyebrows_.*CardMat/.test(n)) {
      m.map = /Hair/.test(n) ? peloMap : cejaMap; m.color.set(0xffffff);
      m.alphaTest = /Hair/.test(n) ? 0.06 : 0.015; m.alphaToCoverage = true; m.transparent = false; m.side = THREE.DoubleSide;
      m.roughness = 0.5; m.metalness = 0; m.needsUpdate = true;
    } else if (/LashMat/.test(n)) {
      m.alphaMap = pestanaMap; m.color.setRGB(0.03, 0.02, 0.012); m.transparent = true; m.depthWrite = false; m.needsUpdate = true;
    } else if (/M_Hide|EyeShell|LacrimalFluid/.test(n)) {
      o.visible = false;
    } else if (/DefaultGarment.*Shirt/.test(n)) {
      m.color.set(0xffffff); m.map = telaFlores(); m.roughness = 0.8; m.needsUpdate = true;   // blusa café con florecitas
    }
  }
});

// cuero cabelludo: las tarjetas de pelo del GLB dejan ver la piel del cráneo; se tiñe la piel
// por encima de la línea del pelo con el color de la raíz (en la pose de reposo de la malla).
{
  eos.updateMatrixWorld(true);
  const ojos = ['FACIAL_L_Eye', 'FACIAL_R_Eye'].map(n => eos.getObjectByName(n).getWorldPosition(new THREE.Vector3()));
  const ojoW = ojos[0].add(ojos[1]).multiplyScalar(0.5);
  eos.traverse(o => {
    if (!o.isMesh || !/MI_Face_Skin/.test(o.material.name)) return;
    // las posiciones pueden venir cuantizadas (meshopt): se pasan a mundo con la recta que une
    // la caja de la geometría con la caja de la malla en reposo, eje por eje
    const pos = o.geometry.attributes.position;
    const cg = new THREE.Box3().setFromBufferAttribute(pos), cw = new THREE.Box3().setFromObject(o, true);
    const esc = new THREE.Vector3().subVectors(cw.max, cw.min).divide(new THREE.Vector3().subVectors(cg.max, cg.min));
    const mascara = new Float32Array(pos.count), v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).sub(cg.min).multiply(esc).add(cw.min);
      const h = v.y - ojoW.y, f = v.z - ojoW.z;
      const ondas = 0.0015 * Math.sin(v.x * 260) + 0.001 * Math.sin(v.x * 710 + 1.3);  // borde apenas irregular
      const linea = 0.065 + ondas - 0.35 * Math.max(0, 0.06 - f);     // la línea baja hacia las sienes y la nuca
      mascara[i] = THREE.MathUtils.smoothstep(h, linea, linea + 0.05);   // transición ancha: sin borde pintado
    }
    o.geometry.setAttribute('aPelo', new THREE.BufferAttribute(mascara, 1));
    const m = o.material;
    m.onBeforeCompile = sh => {
      sh.uniforms.uRaiz = { value: new THREE.Color(0.105, 0.048, 0.022) };   // lineal ≈ sRGB (92, 60, 38), la raíz del pelo
      sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
attribute float aPelo; varying float vPelo; varying vec3 vPos;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
vPelo = aPelo; vPos = position;`);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying float vPelo; varying vec3 vPos; uniform vec3 uRaiz;`)
        .replace('#include <map_fragment>', `#include <map_fragment>
diffuseColor.rgb = mix(diffuseColor.rgb, uRaiz * (0.9 + 0.2 * fract(sin(dot(floor(vPos * 1500.0), vec3(12.9898, 78.233, 37.719))) * 43758.5)), 0.75 * smoothstep(0.35, 1.0, vPelo));
{ float g = dot(diffuseColor.rgb, vec3(0.3, 0.55, 0.15));            // menos rojo: el bake trae párpados y mejillas muy rojos
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(g) * vec3(1.08, 1.0, 0.94), 0.12) * vec3(0.97, 0.94, 0.9); }   // un pelín más cálida y menos pálida`);
    };
    m.needsUpdate = true;
  });
}

// blusa que deja ver los hombros (Miguel, 26 sep): se recorta la camisa por encima de un escote
// recto sobre el pecho y la parte alta de los brazos; en la piel que queda al aire se tapan los
// tirantes grises que el bake del cuerpo trae pintados (píxeles poco saturados → tono de piel).
// PRUEBA, solo con ?hombros=1: el cuerpo exportado viene recortado bajo la camisa (hombros sin
// malla) y el corte se ve tosco; la blusa de verdad se hará en Unreal/Blender y se volverá a exportar.
if (new URLSearchParams(location.search).get('hombros') === '1') {
  eos.updateMatrixWorld(true);
  const ALTURA_ESCOTE = 0.095;          // m por debajo de lo más alto de la camisa (base del cuello)
  let techo = -Infinity;
  eos.traverse(o => { if (o.isMesh && /Shirt/.test(o.material.name)) techo = Math.max(techo, new THREE.Box3().setFromObject(o, true).max.y); });
  const escote = techo - ALTURA_ESCOTE;
  const mascaraAltura = (o, fn) => {    // atributo por vértice con la altura en mundo (reposo), como el cuero cabelludo
    const pos = o.geometry.attributes.position;
    const cg = new THREE.Box3().setFromBufferAttribute(pos), cw = new THREE.Box3().setFromObject(o, true);
    const esc = new THREE.Vector3().subVectors(cw.max, cw.min).divide(new THREE.Vector3().subVectors(cg.max, cg.min));
    const a = new Float32Array(pos.count), v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).sub(cg.min).multiply(esc).add(cw.min); a[i] = fn(v); }
    return a;
  };
  const linea = () => escote;          // escote recto (bardot)
  eos.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material;
    if (/Shirt/.test(m.name)) {
      o.geometry.setAttribute('aSobre', new THREE.BufferAttribute(mascaraAltura(o, v => v.y - linea(v)), 1));
      m.side = THREE.DoubleSide;
      m.onBeforeCompile = sh => {
        sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
attribute float aSobre; varying float vSobre;`).replace('#include <begin_vertex>', `#include <begin_vertex>
vSobre = aSobre;`);
        sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying float vSobre;`).replace('#include <map_fragment>', `#include <map_fragment>
if (vSobre > 0.0) discard;
diffuseColor.rgb *= mix(1.0, 0.75, smoothstep(-0.012, 0.0, vSobre));   // un dobladillo algo más oscuro en el borde`);
      };
      m.needsUpdate = true;
    } else if (/MI_Body/.test(m.name)) {
      o.geometry.setAttribute('aSobre', new THREE.BufferAttribute(mascaraAltura(o, v => v.y - linea(v)), 1));
      m.onBeforeCompile = sh => {
        sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
attribute float aSobre; varying float vSobre;`).replace('#include <begin_vertex>', `#include <begin_vertex>
vSobre = aSobre;`);
        sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying float vSobre;`).replace('#include <map_fragment>', `#include <map_fragment>
{ vec3 c = diffuseColor.rgb; float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
  float gris = 1.0 - smoothstep(0.08, 0.2, (mx - mn) / max(mx, 1e-3));      // tirante: casi sin saturación
  vec3 piel = vec3(0.62, 0.40, 0.31);                                        // tono medio de la piel (lineal)
  diffuseColor.rgb = mix(c, piel * (0.85 + 0.3 * mx), gris * step(-0.16, vSobre)); }`);   // la parte alta del cuerpo (en su propia escala, donde van los tirantes)
      };
      m.needsUpdate = true;
    }
  });
}

// pelo y cejas: el GLB los trae como mallas sueltas (sin piel ni huesos), así que no siguen a la
// cabeza al moverse; se cuelgan del hueso `head`. El pelo lleva además dos capas más: una
// translúcida para rellenar y otra un 4 % más grande, escalada desde la coronilla, que da
// volumen y baja el flequillo (menos frente).
const tarjetas = [];
eos.traverse(o => { if (o.isMesh && !o.isSkinnedMesh && /(Hair|Eyebrows)_.*CardMat/.test(o.material.name)) tarjetas.push(o); });
eos.updateMatrixWorld(true);
const cabezaHueso = eos.getObjectByName('head');
const cajaPelo = new THREE.Box3();
tarjetas.filter(o => /Hair/.test(o.material.name)).forEach(o => cajaPelo.expandByObject(o));
const coronilla = new THREE.Vector3((cajaPelo.min.x + cajaPelo.max.x) / 2, cajaPelo.max.y, (cajaPelo.min.z + cajaPelo.max.z) / 2);
for (const o of tarjetas) {
  const esPelo = /Hair/.test(o.material.name);
  if (!esPelo) {                                  // cejas: sin pelea de profundidad con la piel
    o.material.polygonOffset = true; o.material.polygonOffsetFactor = -2; o.material.polygonOffsetUnits = -2;
  }
  const capas = [o];
  if (!esPelo) {                                  // cejas: la pasada translúcida es la que se ve
    const mc = o.material.clone(); mc.alphaTest = 0; mc.alphaToCoverage = false; mc.transparent = true; mc.depthWrite = false;
    const c2 = o.clone(); c2.material = mc; c2.renderOrder = 3; o.parent.add(c2); capas.push(c2);
  }
  if (esPelo) {
    const m2 = o.material.clone(); m2.alphaTest = 0; m2.alphaToCoverage = false; m2.transparent = true; m2.opacity = 0.85; m2.depthWrite = false;
    const relleno = o.clone(); relleno.material = m2; relleno.renderOrder = 2; o.parent.add(relleno); capas.push(relleno);
    const vol = o.clone(); vol.material = o.material; o.parent.add(vol);
    const ew = new THREE.Matrix4().makeTranslation(coronilla.x, coronilla.y, coronilla.z)
      .multiply(new THREE.Matrix4().makeScale(1.04, 1.05, 1.06))
      .multiply(new THREE.Matrix4().makeTranslation(-coronilla.x, -coronilla.y + 0.004, -coronilla.z));
    vol.updateMatrixWorld(true);
    const w = ew.multiply(vol.matrixWorld.clone());
    vol.parent.updateMatrixWorld(true);
    vol.matrix.copy(vol.parent.matrixWorld.clone().invert().multiply(w)); vol.matrix.decompose(vol.position, vol.quaternion, vol.scale);
    capas.push(vol);
    // tercera capa, un 8 % más grande y translúcida: rellena la coronilla (se veía calva)
    const vol2 = o.clone(); const m3 = m2.clone(); m3.opacity = 0.7; vol2.material = m3; vol2.renderOrder = 2; o.parent.add(vol2);
    const ew2 = new THREE.Matrix4().makeTranslation(coronilla.x, coronilla.y, coronilla.z)
      .multiply(new THREE.Matrix4().makeScale(1.07, 1.03, 1.09))
      .multiply(new THREE.Matrix4().makeTranslation(-coronilla.x, -coronilla.y + 0.002, -coronilla.z));
    vol2.updateMatrixWorld(true);
    const w2 = ew2.multiply(vol2.matrixWorld.clone());
    vol2.matrix.copy(vol2.parent.matrixWorld.clone().invert().multiply(w2)); vol2.matrix.decompose(vol2.position, vol2.quaternion, vol2.scale);
    capas.push(vol2);
  }
  if (cabezaHueso) capas.forEach(c => { c.updateMatrixWorld(true); cabezaHueso.attach(c); });
}

// encuadre: la cabeza (el hueso, o el punto más alto del modelo)
const caja = new THREE.Box3().setFromObject(eos);
const centro = new THREE.Vector3();
if (cabeza) cabeza.getWorldPosition(centro); else { caja.getCenter(centro); centro.y = caja.max.y - 0.12; }
centro.y += 0.03;
controles.target.copy(centro);
camara.position.set(centro.x, centro.y + 0.02, centro.z + 0.95);
if (new URLSearchParams(location.search).get('plano') !== 'cara') {   // de presentadora: cabeza, hombros y escote
  controles.target.set(centro.x, centro.y - 0.09, centro.z);
  camara.position.set(centro.x, centro.y - 0.05, centro.z + 1.3);
}
// ?vista=boca: de cerca y un poco de lado, para ver labios, dientes y lengua
if (new URLSearchParams(location.search).get('vista') === 'boca') {
  const b = eos.getObjectByName('FACIAL_C_Tongue3')?.getWorldPosition(new THREE.Vector3()) ?? centro;
  controles.target.set(b.x, b.y, b.z + 0.03);
  camara.position.set(b.x + 0.06, b.y + 0.01, b.z + 0.26);
}
// ?camara=dx,dy,dz: cámara libre respecto a los ojos (para revisar gafas, lengua, etc. desde cualquier lado)
const camLibre = new URLSearchParams(location.search).get('camara');
if (camLibre) {
  const [dx, dy, dz] = camLibre.split(',').map(Number);
  const o = eos.getObjectByName('FACIAL_L_Eye').getWorldPosition(new THREE.Vector3())
    .add(eos.getObjectByName('FACIAL_R_Eye').getWorldPosition(new THREE.Vector3())).multiplyScalar(0.5);
  controles.target.copy(o); camara.position.set(o.x + dx, o.y + dy, o.z + dz);
}
controles.update();
const bases = cabezas.map(b => b.quaternion.clone());
function girar(e) { const q = new THREE.Quaternion().setFromEuler(e); cabezas.forEach((b, i) => b.quaternion.copy(bases[i]).multiply(q)); }

// gafas: se cuelgan del hueso de la cabeza con la pose de descanso
let gafas = null;
try {
  // gafas.glb sale de Blender con los aros en (±3,25; 12,4; 168,3) cm y el frente hacia -Z
  const g = (await cargador.loadAsync('gafas.glb')).scene;
  gafas = new THREE.Group(); gafas.add(g);
  g.rotation.y = Math.PI;                                   // frente hacia +Z, como la cara
  g.position.set(0, -1.683, -0.124);                        // centro de los aros al origen del grupo
  const ojoI = eos.getObjectByName('FACIAL_L_Eye'), ojoD = eos.getObjectByName('FACIAL_R_Eye');
  eos.updateMatrixWorld(true);
  const pI = ojoI.getWorldPosition(new THREE.Vector3()), pD = ojoD.getWorldPosition(new THREE.Vector3());
  const medio = pI.clone().add(pD).multiplyScalar(0.5);
  const esc = pI.distanceTo(pD) / 0.065;

function aplicar(datos, t) {
  const f = Math.max(0, Math.min(datos.cabeza.length - 1, t * datos.fps));
  const i = Math.floor(f), a = f - i, j = Math.min(i + 1, datos.cabeza.length - 1);
  for (const [n, arr] of Object.entries(datos.curvas)) poner(n, arr[i] * (1 - a) + arr[j] * a);
  if (datos.lengua) {
    const jaw = datos.curvas.jawOpen ? datos.curvas.jawOpen[i] * (1 - a) + datos.curvas.jawOpen[j] * a : 0.2;
    lengua(Object.fromEntries(Object.entries(datos.lengua).map(([k, arr]) => [k, arr[i] * (1 - a) + arr[j] * a])), jaw);
  }
  if (cabeza) {
    const g = datos.cabeza[i].map((v, k) => v * (1 - a) + datos.cabeza[j][k] * a);
    girar(new THREE.Euler(THREE.MathUtils.degToRad(-g[1]), THREE.MathUtils.degToRad(g[0]), THREE.MathUtils.degToRad(g[2]), 'YXZ'));
  }
  if (datos !== mirar.ultimos) { mirar.ultimos = datos; pausasMirada = datos.palabras.slice(1).map((w, k) => [datos.palabras[k][2], w[1]]).filter(([a, b]) => b - a > 0.3 && azar(a * 7) < 0.6); }
  mirar(t);
  subt.innerHTML = datos.palabras.map(([w, x]) => `<span class="${t >= x ? 'ya' : ''}">${w}</span>`).join(' ');
}

// ?grabar=<clip>: sin bucle ni audio; quien graba llama a window.pintar(t) fotograma a fotograma
const grabar = new URLSearchParams(location.search).get('grabar');
if (grabar) {
  const datos = await fetch(`${grabar}/curvas.json`).then(r => r.json());
  document.getElementById('barra').style.display = 'none';
  estado.style.display = 'none';
  window.duracion = datos.duracion;
  window.pintar = t => { aplicar(datos, t); controles.update(); renderer.render(scene, camara); return true; };
  window.listo = true;
} else {
  const reloj = new THREE.Clock();
  function cuadro() {
    requestAnimationFrame(cuadro);
    const dt = reloj.getDelta();
    if (actual) aplicar(actual.datos, ctx.currentTime - actual.t0); else reposo(dt);
    controles.update();
    renderer.render(scene, camara);
  }
  cuadro();
}
if (!grabar) estado.textContent = `${morphs.length} mallas con gestos · ${Object.keys(morphs[0]?.morphTargetDictionary ?? {}).length} gestos · ${cabeza ? 'cabeza articulada' : 'sin hueso de cabeza'}`;
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
