<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pléyade · Lee en inglés a tu medida</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pléyade mide cómo de difícil es un libro en inglés y te acompaña mientras lo lees.">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1030" media="(prefers-color-scheme: dark)">
  <!-- Dónde vive el motor. Vacío = el mismo origen (ng serve con proxy, o un
       servidor que sirva API y front juntos). En un Space estático se pone la
       URL del Space de Gradio al publicar. -->
  <meta name="literalevel-api" content="">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // El tema ANTES de pintar: sin esto la página parpadea en claro y luego se
    // oscurece, que en un móvil de noche es un fogonazo.
    try {
      var t = localStorage.getItem('literalevel.tema');
      if (t && t !== 'sistema') document.documentElement.setAttribute('data-tema', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <div style="font-family:system-ui,sans-serif;padding:3rem 1.5rem;text-align:center;opacity:.7">
      Abriendo Pléyade…
    </div>
  </app-root>
  <noscript>Pléyade necesita JavaScript para funcionar.</noscript>
</body>
</html>
